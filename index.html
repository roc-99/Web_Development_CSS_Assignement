<!DOCTYPE html>

<html>
	<head>
		<title>Weather Report Dashboard</title>
		<link rel="stylesheet" href="weather_report.css">
		<script src="weather_scripts.js" defer></script>
	</head>
	<body>
		<header>Weather Report
			<img src="LogoSun.svg" width="70" height="70" class="logo"/>
		</header>

		<button class="monday" onclick="dayChange(1)">Monday</button>
		<button class="tuesday" onclick="dayChange(2)">Tuesday</button>
		<button class="wednesday" onclick="dayChange(3)">Wednesday</button>
		<button class="thursday" onclick="dayChange(4)">Thursday</button>
		<button class="friday" onclick="dayChange(5)">Friday</button>
		<button class="saturday" onclick="dayChange(6)">Saturday</button>
		<button class="sunday" onclick="dayChange(7)">Sunday</button>

		<hr>

		<div class="temperature_info">
			<section class = "max">
				<h1 id="max_number"> 25 C</h1>
			</section>
			<section class = "min">
				<h1 id="min_number"> 16 C</h1>
			</section>
		</div>

		<hr>
	
		<div class="weather_info">
			<section class = "early_morning">
				<h1>Early Morning</h1>
				<h2>6AM - 9AM</h2>
				<img id="wimg" src="foggy.png" width="250" height="250">
			</section>
			<section class = "late_morning">
				<h1>Late Morning</h1>
				<h2>9AM - 12AM</h2>
				<img  id="wimg" src="cloudy.png" width="250" height="250">
			</section>
			<section class = "early_afternoon">
				<h1>Early Afternoon</h1>
				<h2>12AM - 3PM</h2>
				<img  id="wimg" src="sunny.png" width="250" height="250">
			</section>
			<section class = "late_afternoon">
				<h1>Late Afternoon</h1>
				<h2>3PM - 6PM</h2>
				<img  id="wimg" src="sunny.png" width="250" height="250">
			</section>
			<section class = "evening">
				<h1>Evening</h1>
				<h2>6PM - 9PM</h2>
				<img  id="wimg" src="cloudy_night.png" width="250" height="250">
			</section>
			<section class = "night">
				<h1>Night</h1>
				<h2>9PM - 6AM</h2>
				<img  id="wimg" src="rainy_night.png" width="250" height="250">
			</section>
		</div>
	</body>
</html>
